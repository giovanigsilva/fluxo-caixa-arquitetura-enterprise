global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vertx-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - bff:8080
          - entries-api:8080
          - consolidation-api:8080
          - management-api:8080
          - observability-api:8080
